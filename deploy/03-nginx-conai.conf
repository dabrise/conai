# ConAI Nginx Configuration
# Add this to your nginx config for screens.ri.se
# Typical location: /etc/nginx/sites-available/screens.ri.se
# Or: /etc/nginx/conf.d/screens.ri.se.conf

# Static files (the React frontend built to dist/)
location /conai/ {
    alias /var/www/conai/dist/;
    try_files $uri $uri/ /conai/index.html;
    
    # Cache static assets (JS/CSS with hashed filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# API proxy — all backend routes
location /conai/api/ {
    proxy_pass http://localhost:3001/api/;
    proxy_http_version 1.1;
    
    # Required for Express to trust the X-Forwarded-Proto header
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # For streaming (SSE/OpenRouter)
    proxy_buffering off;
    proxy_cache off;
}
